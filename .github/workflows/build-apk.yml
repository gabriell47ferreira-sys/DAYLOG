name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-34" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r public/* android/app/src/main/assets/public/ || true

      - name: Build Android Debug APK
        shell: bash
        run: |
          cd android
          ./gradlew :app:assembleDebug -PcompileSdkVersion=35 -PtargetSdkVersion=35 -x lint -x test --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED WITH EXIT CODE $EXIT_CODE ==="
            exit $EXIT_CODE
          fi

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle.log

      - name: Locate and Prepare APK for Distribution
        run: |
          echo "=== SEARCHING FOR COMPILED APK ==="
          ls -la android/app/build/outputs/apk/debug/ || true
          find android -name "*.apk"
          APK_PATH=$(find android -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found after compilation."
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ./DAYLOG-AI.apk
          ls -lh ./DAYLOG-AI.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAYLOG-AI-Debug-APK
          path: ./DAYLOG-AI.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "DAYLOG AI v1.0.0 (Android APK)"
          make_latest: true
          body: |
            ### 📱 DAYLOG AI — Aplicativo Oficial Android (.apk)
            
            - **Versão:** v1.0.0
            - **Arquitetura:** Local-First (IndexedDB / Dexie.js)
            - **Compatibilidade:** Android 7.0+
            
            #### 📥 Instruções de Instalação:
            1. Baixe o arquivo `DAYLOG-AI.apk` abaixo no seu celular.
            2. Toque no arquivo baixado para instalar.
            3. Se o Android perguntar, permita "Instalar apps de fontes desconhecidas" para o seu navegador/gerenciador.
            4. O ícone oficial do **DAYLOG AI** estará disponível na sua tela de início!
          files: ./DAYLOG-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
