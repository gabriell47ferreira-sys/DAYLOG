name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./DAYLOG-AI.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAYLOG-AI-Debug-APK
          path: ./DAYLOG-AI.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "DAYLOG AI v1.0.0 (Android APK)"
          body: |
            ### 📱 DAYLOG AI — Aplicativo Oficial Android (.apk)
            
            - **Versão:** v1.0.0
            - **Arquitetura:** Local-First (IndexedDB / Dexie.js)
            - **Compatibilidade:** Android 7.0+
            
            #### 📥 Instruções de Instalação:
            1. Baixe o arquivo `DAYLOG-AI.apk` abaixo no seu celular.
            2. Toque no arquivo baixado para instalar.
            3. Se o Android perguntar, permita "Instalar apps de fontes desconhecidas" para o seu navegador/gerenciador.
            4. O ícone oficial do **DAYLOG AI** estará disponível na sua tela de início!
          files: ./DAYLOG-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
