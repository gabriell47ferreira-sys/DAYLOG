<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DAYLOG AI</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #080A0B;
      color: #F5F5F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: #121619;
      border: 1px solid rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.2);
    }
    .pulse-dot {
      width: 20px;
      height: 20px;
      background: #F59E0B;
      border-radius: 50%;
      animation: pulse 1.8s infinite ease-in-out;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    h1 span {
      color: #F59E0B;
      font-size: 14px;
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      margin-left: 4px;
    }
    p {
      color: #9CA3AF;
      font-size: 12px;
      max-width: 260px;
      line-height: 1.5;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>
  <script>
    // Se estiver online, redireciona suavemente para a nuvem sincronizada
    if (navigator.onLine) {
      window.location.replace("https://daylogia.vercel.app");
    }
  </script>
</head>
<body>
  <div class="logo-container">
    <div class="pulse-dot"></div>
  </div>
  <h1>DAYLOG <span>AI</span></h1>
  <p>Iniciando diário inteligente com privacidade Local-First...</p>
</body>
</html>
